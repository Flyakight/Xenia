# Renders Studio Notes posts: taped-sketch images for Instagram, Pinterest and
# LinkedIn, from the sketches and post.yml in each studio-notes/posts/ folder.
# The finished images are committed back into that folder's out/ directory.

name: Render Studio Notes

on:
  push:
    branches: [main]
    paths:
      - 'studio-notes/posts/**'
      - 'studio-notes/render/**'
      - '.github/workflows/studio-notes.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-render every post, even unchanged ones'
        type: boolean
        default: false

concurrency:
  group: studio-notes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer
        working-directory: studio-notes/render
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Render posts
        working-directory: studio-notes/render
        run: node render.mjs ${{ inputs.force && '--force' || '' }}

      # Commits made with the workflow token don't trigger new workflow runs,
      # so this can't loop, and it won't set off the theme deploy either.
      - name: Commit rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio-notes/posts
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Render Studio Notes posts"
            git pull --rebase --autostash
            git push
          fi
